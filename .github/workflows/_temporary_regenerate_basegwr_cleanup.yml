name: Temporary BaseGWR cleanup regeneration

on:
  push:
    branches:
      - remove-basegwr

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-basegwr
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,docs]"
      - name: Remove remaining current BaseGWR references
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/pygwrx/models/mgwr.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "# BaseGWR's single bandwidth is used only to validate and store the\n"
              "        # initial GWR setting. Final MGWR scales are exposed as bandwidths_.",
              "# The inherited single-bandwidth state is used only for the initial GWR\n"
              "        # calibration. Final MGWR scales are exposed through bandwidths_.",
          )
          path.write_text(text, encoding="utf-8")

          path = Path("HANDOFF_NEXT_CONVERSATION.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "2. The former `BaseGWR` implementation layer has been removed.\n"
              "3. `BaseGWR = BaseSpatialRegressor` remains only as a backward-compatibility identity alias during the 0.1.x cycle.\n"
              "4. New source, examples, and documentation must use `BaseSpatialRegressor`, not `BaseGWR`.",
              "2. The former GWR-specific base implementation layer and its compatibility alias have been removed.\n"
              "3. `BaseSpatialRegressor` is the only public GWR-family regression base class.\n"
              "4. New source, examples, and documentation must use `BaseSpatialRegressor`.",
          )
          text = text.replace(
              "`BaseSpatialRegressor` now contains the kernel, bandwidth, local prediction, and shared GWR-family state formerly held by `BaseGWR`.\n\n"
              "Compatibility remains:\n\n"
              "```python\nBaseGWR = BaseSpatialRegressor\n```",
              "`BaseSpatialRegressor` contains the kernel, bandwidth, local prediction, and shared GWR-family state from the former GWR-specific base layer. The compatibility alias has been removed.",
          )
          text = text.replace(
              "The old hierarchy:\n\n```text\nBaseSpatialRegressor\n└── BaseGWR\n```",
              "The old hierarchy used a GWR-specific compatibility layer beneath `BaseSpatialRegressor`.",
          )
          text = text.replace("`BaseGWR`", "the former compatibility alias")
          text = text.replace("174/174", "173/173")
          text = text.replace("174 public", "173 public")
          text = text.replace("174 APIs", "173 APIs")
          path.write_text(text, encoding="utf-8")

          for name in ("docs/guides/core-numerics.md", "docs/examples/core.md"):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              text = text.replace("        BaseGWR,\n", "")
              text = text.replace("    BaseGWR,\n", "")
              text = text.replace("class TinyGWR(BaseGWR):", "class TinyGWR(BaseSpatialRegressor):")
              text = text.replace("    # BaseGWR remains an identity alias for backward compatibility.\n    assert BaseGWR is BaseSpatialRegressor\n    \n", "")
              text = text.replace("# BaseGWR remains an identity alias for backward compatibility.\nassert BaseGWR is BaseSpatialRegressor\n\n", "")
              text = text.replace(
                  "validation, and result export behavior. `BaseGWR` remains available as\n"
                  "an identity alias for backward compatibility with pyGWRx 0.1.2 code.",
                  "validation, and result export behavior. The deprecated compatibility alias\n"
                  "has been removed from the current public API.",
              )
              path.write_text(text, encoding="utf-8")

          for name in (
              "docs/index.md",
              "docs/examples/index.md",
              "docs/zh/index.md",
              "docs/zh/guides/api-and-examples.md",
          ):
              path = Path(name)
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              text = text.replace("174/174", "173/173")
              text = text.replace("174 public API", "173 public API")
              text = text.replace("174 APIs", "173 APIs")
              text = text.replace("all 174", "all 173")
              text = text.replace("174 个公开 API", "173 个公开 API")
              text = text.replace("174 个公开接口", "173 个公开接口")
              path.write_text(text, encoding="utf-8")
          PY
      - name: Regenerate API and example documentation
        run: |
          python tools/generate_api_docs.py
          python tools/generate_example_docs.py
          python examples/validate_coverage.py
      - name: Check current public tree for stale BaseGWR references
        run: |
          if git grep -n "BaseGWR" -- src tests examples docs tools README.md README.zh.md PROJECT_STRUCTURE.md HANDOFF_NEXT_CONVERSATION.md ':!docs/project/**' ':!archive/**'; then
            echo "Unexpected current BaseGWR reference remains"
            exit 1
          fi
      - name: Commit regenerated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pygwrx/models/mgwr.py HANDOFF_NEXT_CONVERSATION.md docs examples
          if ! git diff --cached --quiet; then
            git commit -m "Finalize BaseGWR cleanup consistency"
            git push origin HEAD:remove-basegwr
          fi
