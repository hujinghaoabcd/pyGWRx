name: D1 Apply RGWR Composition

on:
  push:
    branches:
      - refactor/d1-rgwr-remove-gwr-inheritance

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/d1-rgwr-remove-gwr-inheritance
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply D1 migration
        shell: bash
        run: |
          echo '') | base64 -d > /tmp/d1_apply.py
          python /tmp/d1_apply.py
      - name: Install test tooling
        run: python -m pip install -e '.[dev]'
      - name: Format and smoke-test D1
        shell: bash
        run: |
          python -m black src/pygwrx/models/rgwr.py tests/test_rgwr_inheritance_contract.py
          python -m isort src/pygwrx/models/rgwr.py tests/test_rgwr_inheritance_contract.py
          python -m ruff check src/pygwrx/models/rgwr.py tests/test_rgwr_inheritance_contract.py
          python -m pytest -q tests/test_rgwr.py tests/test_rgwr_inheritance_contract.py tests/test_estimator_fitted_state_atomicity.py
      - name: Commit implementation and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/d1-apply-rgwr-composition.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pygwrx/models/rgwr.py tests/test_rgwr_inheritance_contract.py .github/workflows/d1-apply-rgwr-composition.yml
          git commit -m 'D1: remove RGWR concrete GWR inheritance'
          git push origin HEAD:refactor/d1-rgwr-remove-gwr-inheritance
