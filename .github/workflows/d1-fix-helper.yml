name: D1 Fix Helper

on:
  push:
    branches:
      - refactor/d1-rgwr-remove-gwr-inheritance

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/d1-rgwr-remove-gwr-inheritance
      - name: Fix helper and self-remove
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          helper = Path('.github/workflows/d1-apply-rgwr-composition.yml')
          text = helper.read_text(encoding='utf-8')
          old = "') | base64 -d > /tmp/d1_apply.py"
          new = "' | base64 -d > /tmp/d1_apply.py"
          assert text.count(old) == 1
          helper.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/d1-fix-helper.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/d1-apply-rgwr-composition.yml .github/workflows/d1-fix-helper.yml
          git commit -m 'ci: repair D1 helper command'
          git push origin HEAD:refactor/d1-rgwr-remove-gwr-inheritance
