name: Temporary Generated Documentation Refresh

on:
  push:
    branches:
      - refactor/base-spatial-regressor

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/base-spatial-regressor
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install documentation tooling
        run: python -m pip install -e ".[dev]"

      - name: Regenerate maintained documentation
        run: |
          python tools/generate_example_docs.py
          python tools/generate_api_docs.py

      - name: Commit generated documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/examples docs/api examples/API_COVERAGE.csv examples/API_COVERAGE.json
          if git diff --cached --quiet; then
            echo "Generated documentation is already current."
            exit 0
          fi
          git commit -m "Refresh generated documentation"
          git pull --rebase origin refactor/base-spatial-regressor
          git push origin HEAD:refactor/base-spatial-regressor
