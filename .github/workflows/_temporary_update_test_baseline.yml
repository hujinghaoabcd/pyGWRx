name: Temporary README test baseline update

on:
  push:
    branches:
      - remove-basegwr

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: remove-basegwr
      - name: Update current README test baseline
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in ("README.md", "README.zh.md"):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              old = "363 passed"
              if old not in text:
                  raise SystemExit(f"{old!r} not found in {name}")
              text = text.replace(old, "365 passed", 1)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Verify change scope
        run: |
          git diff --check
          git diff -- README.md README.zh.md
      - name: Commit README baseline update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh.md
          git commit -m "Update current test baseline to 365"
          git push origin HEAD:remove-basegwr
