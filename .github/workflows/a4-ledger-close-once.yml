name: Close A4 execution ledger once

on:
  push:
    branches: [docs/a4-ledger-handoff]

permissions:
  contents: write

jobs:
  close-ledger:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/a4-ledger-handoff
      - name: Record A4 completion in ADR ledger
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('ARCHITECTURE_FINAL_DECISION.md')
          text = path.read_text(encoding='utf-8')
          old = '| A4 | performance/memory baseline harness | PENDING | — | — | benchmark | **下一项代码工作**；不做 noisy CI timing gate |'
          new = '| A4 | performance/memory baseline harness | DONE | #38 | `de64389163fc5094ab46b72671872d26f35b9733` | benchmark + structural memory | observational timing/RSS baseline + live retained-`n × n` guards；无 estimator runtime 变更 |'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one A4 ledger row, found {text.count(old)}')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/a4-ledger-close-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ARCHITECTURE_FINAL_DECISION.md .github/workflows/a4-ledger-close-once.yml
          git commit -m 'Record A4 completion in architecture ledger'
          git push origin HEAD:docs/a4-ledger-handoff
