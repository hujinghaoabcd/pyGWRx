name: A3 Black format once

on:
  push:
    branches: [refactor/a3-migration-risk-matrix]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/a3-migration-risk-matrix
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply Black
        run: |
          python -m pip install 'black>=24.0.0'
          python -m black tests/test_migration_risk_matrix.py
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/a3-black-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_migration_risk_matrix.py .github/workflows/a3-black-format.yml
          git commit -m 'Format A3 migration risk contract test with Black'
          git push origin HEAD:refactor/a3-migration-risk-matrix
