name: Temporary isort formatter

on:
  push:
    branches:
      - remove-basegwr

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: remove-basegwr
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install exact CI formatters
        run: python -m pip install "isort==9.0.1" "black==26.5.1"
      - name: Apply isort and verify Black compatibility
        run: |
          python -m isort src/pygwrx/plotting/_adapters.py
          python -m black src/pygwrx/plotting/_adapters.py
          python -m isort --check-only src/pygwrx/plotting/_adapters.py
          python -m black --check src/pygwrx/plotting/_adapters.py
      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pygwrx/plotting/_adapters.py
          if ! git diff --cached --quiet; then
            git commit -m "Apply isort 9 formatting"
            git push origin HEAD:remove-basegwr
          fi
