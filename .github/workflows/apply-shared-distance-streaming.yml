name: Apply shared distance streaming refactor

on:
  push:
    branches:
      - refactor/shared-distance-streaming

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/shared-distance-streaming
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Apply focused refactor
        run: python tools/_apply_shared_distance_streaming.py
      - name: Format and test touched paths
        run: |
          python -m pip install -e ".[test]" black isort
          python -m black src/pygwrx/core/utils.py src/pygwrx/models/gwr.py src/pygwrx/core/bandwidth.py tests/test_gwr_distance_streaming.py tests/test_bandwidth_distance_streaming.py
          python -m isort src/pygwrx/core/utils.py src/pygwrx/models/gwr.py src/pygwrx/core/bandwidth.py tests/test_gwr_distance_streaming.py tests/test_bandwidth_distance_streaming.py
          python -m pytest -q tests/test_gwr_distance_streaming.py tests/test_bandwidth_distance_streaming.py
      - name: Commit clean branch state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-shared-distance-streaming.yml
          git rm tools/_apply_shared_distance_streaming.py
          git add src/pygwrx/core/utils.py src/pygwrx/models/gwr.py src/pygwrx/core/bandwidth.py tests/test_gwr_distance_streaming.py tests/test_bandwidth_distance_streaming.py
          git commit -m "Centralize bounded distance streaming"
          git push origin HEAD:refactor/shared-distance-streaming
