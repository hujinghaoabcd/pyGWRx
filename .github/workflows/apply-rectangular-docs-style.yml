name: Apply Rectangular Documentation Style

on:
  push:
    branches:
      - docs/rectangular-navigation-style

permissions:
  contents: write

jobs:
  update-style:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/rectangular-navigation-style

      - name: Apply rectangular style and navigation cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path("docs/assets/css/extra.css")
          css = css_path.read_text(encoding="utf-8")
          marker = "/* Rectangular interface and ordered primary navigation */"
          if marker not in css:
              css += r'''

/* Rectangular interface and ordered primary navigation */
:root {
  --pygx-ui-radius: 0;
}

/* Keep true circular decoration, but remove rounding from interface boxes. */
.md-search__form,
.md-search__output,
.md-select__list,
.md-dialog,
.md-tooltip,
.md-typeset blockquote,
.md-typeset table:not([class]),
.md-typeset code,
.md-typeset kbd,
.md-typeset .highlight,
.md-typeset .highlighttable,
.md-typeset .admonition,
.md-typeset details,
.md-typeset .tabbed-set,
.md-typeset .md-button,
.md-typeset .grid.cards > ul > li,
.md-typeset .grid.cards > ol > li,
.doc-signature,
.py gx-placeholder,
.pygx-announcement__badge,
.pygx-eyebrow,
.pygx-path,
.pygx-code-card,
.pygx-model-group,
.pygx-model-links a,
.pygx-proof article,
.pygx-cta,
.model-hero,
.figure-grid figure,
.figure-grid img,
.md-search__form::after {
  border-radius: var(--pygx-ui-radius) !important;
}

/* A restrained rectangular card language: borders define structure, not curves. */
.pygx-path,
.pygx-code-card,
.pygx-model-group,
.pygx-proof article,
.pygx-cta,
.model-hero,
.figure-grid figure {
  box-shadow: none;
}

/* Primary sidebar: regular spacing, explicit hierarchy, and stable wrapping. */
.md-sidebar--primary {
  border-right: 1px solid var(--pygx-line);
}

.md-sidebar--primary .md-sidebar__scrollwrap {
  padding-right: .65rem;
}

.md-sidebar--primary .md-nav {
  font-size: .71rem;
  line-height: 1.35;
}

.md-sidebar--primary .md-nav__title {
  margin: 0;
  padding: .52rem .52rem;
  border-bottom: 1px solid var(--pygx-line);
  border-radius: 0;
  background: transparent;
  line-height: 1.25;
}

.md-sidebar--primary .md-nav__list,
.md-sidebar--primary .md-nav__item {
  margin: 0;
  padding: 0;
}

.md-sidebar--primary .md-nav__item + .md-nav__item {
  margin-top: 1px;
}

.md-sidebar--primary .md-nav__link {
  display: flex;
  align-items: flex-start;
  min-height: 1.9rem;
  margin: 0;
  padding: .38rem .52rem;
  border-radius: 0 !important;
  line-height: 1.35;
  overflow-wrap: anywhere;
  word-break: normal;
  hyphens: none;
}

.md-sidebar--primary .md-nav__link:hover {
  color: var(--pygx-green-800);
  background: var(--pygx-canvas-soft);
}

.md-sidebar--primary .md-nav__link--active,
.md-sidebar--primary .md-nav__link--active:hover {
  padding-left: calc(.52rem - .18rem);
  border-left: .18rem solid var(--pygx-green-600);
  color: var(--pygx-green-900) !important;
  background: var(--pygx-green-050) !important;
  font-weight: 700;
}

.md-sidebar--primary .md-nav__item--nested > .md-nav__link {
  color: var(--pygx-ink-800);
  font-weight: 660;
}

.md-sidebar--primary .md-nav__item--nested > .md-nav {
  margin: 0 0 .35rem .5rem;
  padding-left: .52rem;
  border-left: 1px solid var(--pygx-line);
}

/* Section labels become consistent rectangular dividers instead of loose cards. */
.md-sidebar--primary .md-nav__item--section > .md-nav__link {
  margin-top: .78rem;
  padding: .46rem .52rem .36rem;
  border-bottom: 1px solid var(--pygx-line-strong);
  color: var(--pygx-ink-950);
  background: transparent !important;
  font-size: .7rem;
  font-weight: 730;
  letter-spacing: .01em;
}

.md-sidebar--primary .md-nav__item--section:first-child > .md-nav__link {
  margin-top: 0;
}

.md-sidebar--primary .md-nav__icon {
  margin-top: .08rem;
}

/* Keep the right-hand page outline compact and rectangular as well. */
.md-sidebar--secondary .md-nav__link {
  margin: 0;
  padding-top: .22rem;
  padding-bottom: .22rem;
  border-radius: 0;
  line-height: 1.35;
  overflow-wrap: anywhere;
}

@media screen and (min-width: 76.25em) {
  .md-sidebar--primary {
    width: 15rem;
  }
}
'''
              css_path.write_text(css, encoding="utf-8", newline="\n")

          mkdocs_path = Path("mkdocs.yml")
          mkdocs = mkdocs_path.read_text(encoding="utf-8")
          replacements = {
              "    - Overview: getting-started/index.md": "    - getting-started/index.md",
              "    - Overview: models/index.md": "    - models/index.md",
              "    - Overview: guides/index.md": "    - guides/index.md",
              "    - Overview: tutorials/index.md": "    - tutorials/index.md",
              "  - Overview: examples/index.md": "  - examples/index.md",
              "  - Overview: api/index.md": "  - api/index.md",
              "    - Overview: api/models/index.md": "    - api/models/index.md",
              "    - Overview: api/core/index.md": "    - api/core/index.md",
              "    - Overview: api/diagnostics/index.md": "    - api/diagnostics/index.md",
              "    - Overview: api/plotting/index.md": "    - api/plotting/index.md",
              "    - Overview: api/io/index.md": "    - api/io/index.md",
              "    - Overview: development/index.md": "    - development/index.md",
              "    - Overview: project/index.md": "    - project/index.md",
              "  - 中文首页: zh/index.md": "  - zh/index.md",
              "    - 模型总览: zh/models/index.md": "    - zh/models/index.md",
              "    - 指南总览: zh/guides/index.md": "    - zh/guides/index.md",
          }
          for old, new in replacements.items():
              if old not in mkdocs:
                  raise RuntimeError(f"Expected navigation entry not found: {old}")
              mkdocs = mkdocs.replace(old, new, 1)
          mkdocs_path.write_text(mkdocs, encoding="utf-8", newline="\n")
          PY

      - name: Validate documentation build
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"
          python -m mkdocs build --strict

      - name: Commit documentation style update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/css/extra.css mkdocs.yml
          git commit -m "Use rectangular documentation styling"
          git push origin HEAD:docs/rectangular-navigation-style
