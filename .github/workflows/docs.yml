name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MPLBACKEND: "Agg"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install documentation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"
      - name: Strict build
        run: python -m mkdocs build --strict --site-dir site
      - uses: actions/upload-artifact@v7
        with:
          name: documentation-site
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install documentation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"
      - name: Deploy GitHub Pages
        run: python -m mkdocs gh-deploy --strict --force
