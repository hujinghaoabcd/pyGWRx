name: Update bandwidth memory docs

on:
  push:
    branches:
      - perf/stream-bandwidth-distances

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/stream-bandwidth-distances
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Update documentation
        run: python tools/_update_bandwidth_memory_docs.py
      - name: Commit clean branch state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-bandwidth-memory-docs.yml
          git rm tools/_update_bandwidth_memory_docs.py
          git add docs/models/gwr.md
          git commit -m "Document streamed automatic bandwidth selection"
          git push origin HEAD:perf/stream-bandwidth-distances
