name: C1 Isort Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  isort-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Normalize imports
        run: |
          python -m pip install "isort==9.0.1" "black==26.5.1"
          python -m isort src/pygwrx/models/gwr.py
          python -m black src/pygwrx/models/gwr.py
      - name: Commit normalized imports
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pygwrx/models/gwr.py
          git commit -m "style: normalize C1 GWR imports"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
