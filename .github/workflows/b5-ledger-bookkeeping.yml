name: B5 Ledger Bookkeeping Helper

on:
  push:
    branches:
      - docs/b5-ledger-handoff

permissions:
  contents: write

jobs:
  update-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/b5-ledger-handoff
      - name: Replace exactly one B5 ledger row
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("ARCHITECTURE_FINAL_DECISION.md")
          text = path.read_text(encoding="utf-8")
          old = "| B5 | weights + neighbourhood policies | PENDING | — | — | per-family semantics tests | 不强制一个 adaptive 规则 |"
          new = "| B5 | weights + neighbourhood policies | DONE | #50 | `cdb2bfed50a107d1bed2b19380eff7ab8dea1763` | per-family semantics tests + GWR refs + full CI | private-first `core.weights` + `FixedBandwidth` / `AdaptiveBandwidth` / `NeighbourhoodPolicy`; GWR/MGWR distance-threshold inclusive (`nextafter`) 与 GWPCA/GWDA/GWSS stable-rank/exact-boundary 语义分别冻结；未迁移 estimator execution path、未改 solver/search/kernel/statistics |"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one B5 ledger row, found {count}.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit ledger update and self-remove helper
        shell: bash
        run: |
          rm .github/workflows/b5-ledger-bookkeeping.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ARCHITECTURE_FINAL_DECISION.md .github/workflows/b5-ledger-bookkeeping.yml
          git diff --cached --check
          git commit -m "Record B5 completion in architecture ledger"
          git push origin HEAD:docs/b5-ledger-handoff
