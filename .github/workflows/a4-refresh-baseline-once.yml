name: A4 refresh unique-buffer baseline once

on:
  push:
    branches: [refactor/a4-performance-memory-baseline]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/a4-performance-memory-baseline
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Patch benchmark accounting
        run: |
          python - <<'PY'
          from pathlib import Path

          harness = Path('tools/benchmarks/architecture_baseline.py')
          text = harness.read_text(encoding='utf-8')
          start = text.index('def _dense_square_inventory(')
          end = text.index('\n\ndef _fingerprint', start)
          replacement = '''def _dense_square_inventory(model: Any, n: int) -> list[dict[str, Any]]:
              buffers: dict[tuple[int, int], dict[str, Any]] = {}
              for name, value in vars(model).items():
                  if not (
                      isinstance(value, np.ndarray)
                      and value.ndim == 2
                      and value.shape == (n, n)
                  ):
                      continue
                  address = int(value.__array_interface__["data"][0])
                  key = (address, int(value.nbytes))
                  item = buffers.setdefault(
                      key,
                      {
                          "attributes": [],
                          "shape": [n, n],
                          "megabytes": value.nbytes / (1024.0 * 1024.0),
                      },
                  )
                  item["attributes"].append(name)

              result = list(buffers.values())
              for item in result:
                  item["attributes"].sort()
              return sorted(result, key=lambda item: item["attributes"][0])
          '''
          text = text[:start] + replacement + text[end:]
          text = text.replace(
              'dense_arrays = _dense_square_inventory(model, n)',
              'dense_buffers = _dense_square_inventory(model, n)',
          )
          text = text.replace(
              'item["megabytes"] for item in dense_arrays',
              'item["megabytes"] for item in dense_buffers',
          )
          text = text.replace(
              '"retained_dense_square_arrays": dense_arrays',
              '"retained_dense_square_buffers": dense_buffers',
          )
          harness.write_text(text, encoding='utf-8')

          test = Path('tests/test_architecture_benchmark_harness.py')
          text = test.read_text(encoding='utf-8')
          text = text.replace(
              'retained_dense_square_arrays',
              'retained_dense_square_buffers',
          )
          start = text.index('    hat_arrays = {')
          end = text.index(
              '    assert scenarios["scalable_gwr_large_n"]',
              start,
          )
          replacement = '''    hat_buffers = scenarios["gwr_manual_hat"]["retained_dense_square_buffers"]
              assert len(hat_buffers) == 1
              assert set(hat_buffers[0]["attributes"]) == {"S_matrix_", "hat_matrix_"}

          '''
          text = text[:start] + replacement + text[end:]
          text = text.replace(
              'sgwr_arrays = scenarios["sgwr_weight_heavy"]["retained_dense_square_buffers"]\n    assert len(sgwr_arrays) >= 2',
              'sgwr_buffers = scenarios["sgwr_weight_heavy"]["retained_dense_square_buffers"]\n    assert len(sgwr_buffers) >= 3',
          )
          test.write_text(text, encoding='utf-8')

          readme = Path('benchmarks/README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace(
              'directly retained `n × n` NumPy arrays and their total size;',
              'unique directly retained `n × n` NumPy buffers, grouping aliasing attributes, and their total size;',
          )
          readme.write_text(text, encoding='utf-8')
          PY
      - name: Install package and tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install 'black>=24.0.0' pytest
      - name: Format, regenerate, and verify
        run: |
          python -m black tools/benchmarks/architecture_baseline.py tests/test_architecture_benchmark_harness.py
          python tools/benchmarks/architecture_baseline.py --output benchmarks/architecture_baseline.json
          python -m pytest -q tests/test_architecture_benchmark_harness.py
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/a4-refresh-baseline-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/benchmarks/architecture_baseline.py tests/test_architecture_benchmark_harness.py benchmarks/architecture_baseline.json benchmarks/README.md .github/workflows/a4-refresh-baseline-once.yml
          git commit -m 'Deduplicate retained benchmark buffers and refresh baseline'
          git push origin HEAD:refactor/a4-performance-memory-baseline
