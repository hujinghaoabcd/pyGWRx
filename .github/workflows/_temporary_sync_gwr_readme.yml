name: Temporary GWR README sync

on:
  push:
    branches: [gwr-reference-validation]

permissions:
  contents: write

concurrency:
  group: temporary-gwr-readme-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gwr-reference-validation
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Synchronize validation status text
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("README.md"): {
                  "365 passed": "400 passed",
                  "- `mgwr` and `spglm` are used only in optional GWGLM reference-comparison tests, not during ordinary GWGLM fitting.":
                      "- `mgwr` is used only in optional GWR/GWGLM reference-comparison tests, and `spglm` only in optional GWGLM reference tests; ordinary model fitting does not depend on either package.",
              },
              Path("README.zh.md"): {
                  "365 passed": "400 passed",
                  "- `mgwr` 与 `spglm` 只用于可选的 GWGLM 参考对照测试，正常 GWGLM 拟合不会调用这两个包。":
                      "- `mgwr` 仅用于可选的 GWR/GWGLM 参考对照测试，`spglm` 仅用于可选的 GWGLM 参考测试；正常模型拟合不依赖这两个包。",
              },
          }

          for path, mapping in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in mapping.items():
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {path}: {old}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Commit README synchronization
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh.md
          git diff --cached --check
          git commit -m "Update GWR validation test baseline [skip ci]"
          git push origin HEAD:gwr-reference-validation
