name: A4 deduplicate retained buffers once

on:
  push:
    branches: [refactor/a4-performance-memory-baseline]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/a4-performance-memory-baseline
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Repair unique-buffer accounting
        run: |
          python - <<'PY'
          from pathlib import Path

          harness = Path('tools/benchmarks/architecture_baseline.py')
          text = harness.read_text(encoding='utf-8')
          old = '''def _dense_square_inventory(model: Any, n: int) -> list[dict[str, Any]]:
              arrays = []
              for name, value in vars(model).items():
                  if isinstance(value, np.ndarray) and value.ndim == 2 and value.shape == (n, n):
                      arrays.append(
                          {
                              "attribute": name,
                              "shape": [n, n],
                              "megabytes": value.nbytes / (1024.0 * 1024.0),
                          }
                      )
              return sorted(arrays, key=lambda item: item["attribute"])
          '''
          new = '''def _dense_square_inventory(model: Any, n: int) -> list[dict[str, Any]]:
              buffers: dict[tuple[int, int], dict[str, Any]] = {}
              for name, value in vars(model).items():
                  if not (
                      isinstance(value, np.ndarray)
                      and value.ndim == 2
                      and value.shape == (n, n)
                  ):
                      continue
                  address = int(value.__array_interface__["data"][0])
                  key = (address, int(value.nbytes))
                  item = buffers.setdefault(
                      key,
                      {
                          "attributes": [],
                          "shape": [n, n],
                          "megabytes": value.nbytes / (1024.0 * 1024.0),
                      },
                  )
                  item["attributes"].append(name)

              result = list(buffers.values())
              for item in result:
                  item["attributes"].sort()
              return sorted(result, key=lambda item: item["attributes"][0])
          '''
          if old not in text:
              raise SystemExit('expected inventory function was not found')
          text = text.replace(old, new)
          text = text.replace('dense_arrays = _dense_square_inventory(model, n)', 'dense_buffers = _dense_square_inventory(model, n)')
          text = text.replace('item["megabytes"] for item in dense_arrays', 'item["megabytes"] for item in dense_buffers')
          text = text.replace('"retained_dense_square_arrays": dense_arrays', '"retained_dense_square_buffers": dense_buffers')
          harness.write_text(text, encoding='utf-8')

          test = Path('tests/test_architecture_benchmark_harness.py')
          text = test.read_text(encoding='utf-8')
          text = text.replace('retained_dense_square_arrays', 'retained_dense_square_buffers')
          old = '''    hat_arrays = {
              item["attribute"]
              for item in scenarios["gwr_manual_hat"]["retained_dense_square_buffers"]
          }
          assert "hat_matrix_" in hat_arrays or "S_matrix_" in hat_arrays
          '''
          new = '''    hat_buffers = scenarios["gwr_manual_hat"]["retained_dense_square_buffers"]
              assert len(hat_buffers) == 1
              assert set(hat_buffers[0]["attributes"]) == {"S_matrix_", "hat_matrix_"}
          '''
          if old not in text:
              raise SystemExit('expected GWR-hat test block was not found')
          text = text.replace(old, new)
          text = text.replace('sgwr_arrays = scenarios["sgwr_weight_heavy"]["retained_dense_square_buffers"]\n    assert len(sgwr_arrays) >= 2', 'sgwr_buffers = scenarios["sgwr_weight_heavy"]["retained_dense_square_buffers"]\n    assert len(sgwr_buffers) >= 3')
          test.write_text(text, encoding='utf-8')

          readme = Path('benchmarks/README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace(
              'directly retained `n × n` NumPy arrays and their total size;',
              'unique directly retained `n × n` NumPy buffers, grouping aliasing attributes, and their total size;',
          )
          readme.write_text(text, encoding='utf-8')
          PY
      - name: Install package and formatter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install 'black>=24.0.0'
      - name: Format and regenerate baseline
        run: |
          python -m black tools/benchmarks/architecture_baseline.py tests/test_architecture_benchmark_harness.py
          python tools/benchmarks/architecture_baseline.py --output benchmarks/architecture_baseline.json
          python -m pytest -q tests/test_architecture_benchmark_harness.py
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/a4-deduplicate-buffers-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/benchmarks/architecture_baseline.py tests/test_architecture_benchmark_harness.py benchmarks/architecture_baseline.json benchmarks/README.md .github/workflows/a4-deduplicate-buffers-once.yml
          git commit -m 'Deduplicate retained benchmark buffers and refresh baseline'
          git push origin HEAD:refactor/a4-performance-memory-baseline
