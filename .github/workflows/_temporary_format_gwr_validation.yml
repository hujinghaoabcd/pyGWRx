name: Temporary GWR validation formatter

on:
  push:
    branches: [gwr-reference-validation]

permissions:
  contents: write

concurrency:
  group: temporary-gwr-validation-formatter
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gwr-reference-validation
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install formatting tools
        run: python -m pip install "black==26.5.1" "isort==9.0.1" "ruff==0.16.5"
      - name: Format GWR validation Python files
        run: |
          files=(
            tools/reference/gwr/generate_mgwr.py
            tools/reference/gwr/generate_bandwidth_curves.py
            tools/reference/gwr/compare_references.py
            tools/reference/gwr/compare_bandwidth_curves.py
            tests/test_gwr_external_references.py
          )
          python -m black "${files[@]}"
          python -m isort "${files[@]}"
          python -m ruff check --fix "${files[@]}"
          python -m black "${files[@]}"
          python -m isort "${files[@]}"
      - name: Commit formatting
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/reference/gwr/*.py tests/test_gwr_external_references.py
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
          else
            git diff --cached --check
            git commit -m "Format GWR reference validation [skip ci]"
            git push origin HEAD:gwr-reference-validation
          fi
