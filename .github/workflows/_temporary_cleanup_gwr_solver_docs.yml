name: Temporary GWR solver doc cleanup
on:
  push:
    branches: [refactor-gwr-unpenalized-solver]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor-gwr-unpenalized-solver
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python tools/_temporary_cleanup_gwr_solver_docs.py
      - run: python -m pip install -e ".[dev,reference]"
      - run: python -m black src/pygwrx/core/solver.py src/pygwrx/core/bandwidth.py
      - run: python tools/generate_api_docs.py
      - run: python -m pytest -q tests/test_solver_unpenalized.py tests/test_gwr_external_references.py tests/test_gwr_columbus_reference.py
      - run: python -m ruff check src/pygwrx/core/solver.py src/pygwrx/core/bandwidth.py
      - name: Commit cleanup
        run: |
          rm .github/workflows/_temporary_cleanup_gwr_solver_docs.yml
          rm tools/_temporary_cleanup_gwr_solver_docs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Clarify unpenalized GWR solver semantics"
          git pull --rebase origin refactor-gwr-unpenalized-solver
          git push origin HEAD:refactor-gwr-unpenalized-solver
