name: Restore GTWR equivalence test

on:
  push:
    branches:
      - fix/gwr-freeze-contract

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/gwr-freeze-contract
          fetch-depth: 0
      - name: Restore test from main and make focused edit
        run: |
          git show origin/main:tests/test_gtwr.py > tests/test_gtwr.py
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_gtwr.py')
          s = p.read_text(encoding='utf-8')
          old = ').fit(X, y, coords, compute_local_r2=False)\n    gtwr = GTWR('
          new = ').fit(\n        X, y, coords, compute_local_r2=False, compute_hat_matrix=True\n    )\n    gtwr = GTWR('
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python -m pip install black
          python -m black tests/test_gtwr.py
      - name: Verify focused test
        run: |
          python -m pip install -e ".[test]"
          python -m pytest -q tests/test_gtwr.py::test_lambda_one_reduces_to_standard_gwr
      - name: Commit clean state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/restore-gtwr-equivalence-test.yml
          git add tests/test_gtwr.py
          git commit -m "Request GWR hat matrix in GTWR equivalence test"
          git push origin HEAD:fix/gwr-freeze-contract
