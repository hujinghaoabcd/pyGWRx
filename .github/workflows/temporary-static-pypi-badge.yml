name: Temporary Static PyPI Badge Fix

on:
  push:
    branches:
      - fix/static-pypi-badge

permissions:
  contents: write

jobs:
  update-readmes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/static-pypi-badge

      - name: Replace dynamic PyPI badge with static release badge
        run: |
          python - <<'PY'
          from pathlib import Path

          old = "https://img.shields.io/pypi/v/pygwrx?label=PyPI&color=139C5A"
          new = "https://img.shields.io/badge/PyPI-v0.1.2-139C5A.svg"
          for name in ("README.md", "README.zh.md"):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected badge URL not found in {name}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY

      - name: Commit badge correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh.md
          git commit -m "Use static PyPI release badge"
          git push origin HEAD:fix/static-pypi-badge
