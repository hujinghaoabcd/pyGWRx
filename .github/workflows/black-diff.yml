name: Black Diff

on:
  pull_request:

permissions:
  contents: write

jobs:
  black-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Black
        run: python -m pip install "black==26.5.1"
      - name: Normalize C1 files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/pygwrx/models/_gwr_engine.py")
          source = path.read_text(encoding="utf-8")
          marker = "folded into standard GWR.\n\"\"\""
          replacement = "folded into standard GWR.\n\nAuthor:\n    Jinghao Hu\n\"\"\""
          if "Author:\n    Jinghao Hu" not in source:
              if marker not in source:
                  raise SystemExit("expected module-docstring marker not found")
              source = source.replace(marker, replacement, 1)
              path.write_text(source, encoding="utf-8")
          PY
          python -m black src/pygwrx/models/_gwr_engine.py tests/test_gwr_private_engine_contract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pygwrx/models/_gwr_engine.py tests/test_gwr_private_engine_contract.py
          if ! git diff --cached --quiet; then
            git commit -m "style: normalize C1 private engine files"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
