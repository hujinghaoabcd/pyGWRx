name: Black Diff

on:
  pull_request:

permissions:
  contents: read

jobs:
  black-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Black
        run: python -m pip install "black==26.5.1"
      - name: Show Black diff
        run: python -m black --check --diff src/pygwrx/models/_gwr_engine.py tests/test_gwr_private_engine_contract.py
