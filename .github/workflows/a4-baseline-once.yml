name: A4 architecture baseline once

on:
  push:
    branches: [refactor/a4-performance-memory-baseline]

permissions:
  contents: write

jobs:
  baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/a4-performance-memory-baseline
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install package and formatter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install 'black>=24.0.0'
      - name: Canonical formatting
        run: |
          python -m black tools/benchmarks/architecture_baseline.py tests/test_architecture_benchmark_harness.py
      - name: Generate observational baseline
        run: |
          python tools/benchmarks/architecture_baseline.py --output benchmarks/architecture_baseline.json
          cat benchmarks/architecture_baseline.json
      - name: Remove one-shot workflow and commit baseline
        run: |
          rm .github/workflows/a4-baseline-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/benchmarks/architecture_baseline.py tests/test_architecture_benchmark_harness.py benchmarks/architecture_baseline.json .github/workflows/a4-baseline-once.yml
          git commit -m 'Capture pre-refactor architecture performance baseline'
          git push origin HEAD:refactor/a4-performance-memory-baseline
