name: Temporary GWR reference generation

on:
  push:
    branches: [gwr-reference-validation]

permissions:
  contents: write

concurrency:
  group: temporary-gwr-reference-generation
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gwr-reference-validation
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Python reference environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mgwr==2.2.1" pandas numpy
          python -m pip install -e .
      - name: Generate mgwr reference
        run: python tools/reference/gwr/generate_mgwr.py
      - name: Generate controlled PyGWRx and mgwr bandwidth curves
        run: python tools/reference/gwr/generate_bandwidth_curves.py
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::jsonlite
            any::sp
            any::spgwr
            any::GWmodel
          needs: check
      - name: Generate GWmodel and spgwr references
        run: Rscript tools/reference/gwr/generate_r_references.R
      - name: Generate controlled GWmodel and spgwr bandwidth curves
        run: Rscript tools/reference/gwr/generate_r_bandwidth_curves.R
      - name: Compare PyGWRx with external references
        run: python tools/reference/gwr/compare_references.py
      - name: Compare controlled bandwidth criterion curves
        run: python tools/reference/gwr/compare_bandwidth_curves.py
      - name: Upload references and validation report
        uses: actions/upload-artifact@v7
        with:
          name: gwr-external-validation
          if-no-files-found: error
          path: |
            tests/reference_data/gwr/*.json
            tools/reference/gwr/generate_*.py
            tools/reference/gwr/generate_*.R
            tools/reference/gwr/compare_*.py
            validation_results/gwr/*
      - name: Freeze generated references and reports
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/reference_data/gwr/*.json validation_results/gwr/*
          if git diff --cached --quiet; then
            echo "Generated references are already current."
          else
            git commit -m "Freeze GWR external validation results [skip ci]"
            git push origin HEAD:gwr-reference-validation
          fi
