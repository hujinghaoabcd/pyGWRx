name: Temporary GWR reference generation

on:
  push:
    branches: [gwr-reference-validation]

permissions:
  contents: write

concurrency:
  group: temporary-gwr-reference-generation
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gwr-reference-validation
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Generate mgwr reference
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mgwr==2.2.1" pandas numpy
          python tools/reference/gwr/generate_mgwr.py
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::jsonlite
            any::sp
            any::spgwr
            any::GWmodel
          needs: check
      - name: Align generator with GWmodel API
        run: |
          sed -i '/    hatmatrix = TRUE,/d; /    hatmatrix = FALSE,/d' tools/reference/gwr/generate_r_references.R
      - name: Generate GWmodel and spgwr references
        run: Rscript tools/reference/gwr/generate_r_references.R
      - name: Commit frozen references and generator correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/reference/gwr/generate_r_references.R tests/reference_data/gwr/*.json
          git diff --cached --check
          git commit -m "Generate external GWR reference fixtures"
          git fetch origin gwr-reference-validation
          git rebase origin/gwr-reference-validation
          git push origin HEAD:gwr-reference-validation
