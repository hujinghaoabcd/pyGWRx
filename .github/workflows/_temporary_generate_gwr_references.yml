name: Temporary GWR reference generation

on:
  push:
    branches: [gwr-reference-validation]

permissions:
  contents: read

concurrency:
  group: temporary-gwr-reference-generation
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gwr-reference-validation
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Generate mgwr reference
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mgwr==2.2.1" pandas numpy
          python tools/reference/gwr/generate_mgwr.py
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::jsonlite
            any::sp
            any::spgwr
            any::GWmodel
          needs: check
      - name: Align generator with GWmodel API
        run: |
          sed -i '/    hatmatrix = TRUE,/d; /    hatmatrix = FALSE,/d' tools/reference/gwr/generate_r_references.R
      - name: Generate GWmodel and spgwr references
        run: Rscript tools/reference/gwr/generate_r_references.R
      - name: Upload frozen references
        uses: actions/upload-artifact@v7
        with:
          name: gwr-external-references
          if-no-files-found: error
          path: |
            tests/reference_data/gwr/*.json
            tools/reference/gwr/generate_r_references.R
