name: C2 Bookkeeping Update

on:
  push:
    branches:
      - docs/c2-gwr-engine-numerical-lock-bookkeeping

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/c2-gwr-engine-numerical-lock-bookkeeping
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Update C2 bookkeeping documents
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Cross-window handoff ledger.
          path = Path("00_REFACTOR_HANDOFF.md")
          text = path.read_text(encoding="utf-8")
          old_next = "- 下一项固定为：**C2 — GWR engine numerical lock**。"
          new_next = (
              "- C2 — GWR engine numerical lock：**DONE**，PR #62，merge SHA "
              "`0fd763dc8df7a4185f532e35b48c320d8a0e5215`。在 C1 private engine 边界新增 "
              "blocking external-reference numerical locks，直接使用既有冻结的 mgwr 2.2.1 artifacts 验证 "
              "5 类 calibration/inference 场景与 independent-location prediction；reference suite 从 50 增至 "
              "56 tests，并继续覆盖 deep hat/influence/Cook's D、rank-deficient behavior、streaming、bandwidth "
              "provenance 与 failed-refit atomicity。Quality、coverage、minimum dependencies、build/install、"
              "Ubuntu/macOS/Windows × Python 3.11–3.14、Documentation 与 Security/SBOM 全部通过；未修改 "
              "runtime、统计公式、reference fixture、tolerance、search semantics 或 public API。\n"
              "- 下一项固定为：**C3 — 禁止新增新的 protected ‘给子类用’ GWR 方法**。"
          )
          assert text.count(old_next) == 1
          text = text.replace(old_next, new_next)
          lines = text.splitlines()
          prefix = "A1/A2/A3/A4/A5、B1/B2/B3/B4/B5/B6/B7/B8 与 C1 共同构成进入 C2 的安全冻结："
          matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
          assert len(matches) == 1
          lines[matches[0]] = (
              "A1/A2/A3/A4/A5、B1/B2/B3/B4/B5/B6/B7/B8、C1 与 C2 共同构成进入 C3 的安全冻结："
              "Public API / capability、failed-refit atomicity、迁移风险、性能/内存现状、用户可观察契约、"
              "private capability spine、canonical validation/distance/time/weights/WLS/search-domain/"
              "Gaussian-diagnostics 边界、standard-GWR private engine ownership，以及 56 个 blocking reference "
              "tests 所形成的 engine numerical lock 必须同时守住。A4 的 timing/RSS 仅作为 observational baseline，"
              "不设置 noisy wall-time CI gate；live structural memory guards 继续阻止 streamed GWR 意外引入 retained "
              "`n × n` buffer，并保留 `compute_hat_matrix=True` 的显式 dense S 行为。C3 只允许锁定 GWR 不再新增供"
              "子类依赖的 protected implementation surface，并明确 GWR 不再作为其他 estimator 的 implementation "
              "framework；不得改变 estimator API、统计公式、数值结果、search semantics、reference fixture 或 tolerance，"
              "不得提前执行 D1 concrete-inheritance removal、base rewrite 或性能算法重写。"
          )
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          # 2) Final architecture phase ledger.
          path = Path("ARCHITECTURE_FINAL_DECISION.md")
          text = path.read_text(encoding="utf-8")
          lines = text.splitlines()
          matches = [i for i, line in enumerate(lines) if line.startswith("| C2 | GWR engine numerical lock |")]
          assert len(matches) == 1
          idx = matches[0]
          lines[idx] = (
              "| C2 | GWR engine numerical lock | DONE | #62 | "
              "`0fd763dc8df7a4185f532e35b48c320d8a0e5215` | 56 external/private-engine refs + full CI | "
              "direct `_gwr_engine` locks against frozen mgwr 2.2.1 artifacts; deep diagnostics/rank/prediction/streaming/"
              "bandwidth provenance/failed-refit gates retained; no runtime/formula/reference/tolerance change |"
          )
          if not any(line.startswith("| C3 |") for line in lines):
              lines.insert(
                  idx + 1,
                  "| C3 | freeze GWR protected subclass surface | PENDING | — | — | architecture + GWR freeze | "
                  "no new protected subclass implementation hooks; GWR ceases to be an estimator implementation framework |",
              )
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          # 3) Numerical validation evidence must reflect the new blocking count.
          path = Path("validation_results/gwr/GWR_VALIDATION_EVIDENCE.md")
          text = path.read_text(encoding="utf-8")
          old = (
              "| Blocking reference CI | Fail if aligned quantities drift outside tolerance | "
              "`tests/test_gwr_external_references.py`, `tests/test_gwr_mgwr_deep_diagnostics_reference.py`, Columbus reference tests |"
          )
          new = (
              "| Blocking reference CI | Fail if aligned quantities drift outside tolerance | "
              "`tests/test_gwr_external_references.py`, `tests/test_gwr_mgwr_deep_diagnostics_reference.py`, "
              "`tests/test_gwr_engine_numerical_lock.py`, Columbus reference tests |"
          )
          assert text.count(old) == 1
          text = text.replace(old, new)
          old_count = (
              "The GWR external-reference suite contains **50 tests marked `reference`** after adding the five deep-diagnostic "
              "mgwr cases. It runs as a dedicated blocking CI job in addition to the normal regression, platform, minimum-dependency, "
              "build, coverage, documentation, quality, and security checks."
          )
          new_count = (
              "The GWR external-reference suite contains **56 tests marked `reference`** after C2 adds six direct private-engine "
              "reference cases on top of the existing 50-test external/public-GWR suite. It runs as a dedicated blocking CI job in "
              "addition to the normal regression, platform, minimum-dependency, build, coverage, documentation, quality, and security checks."
          )
          assert text.count(old_count) == 1
          text = text.replace(old_count, new_count)
          marker = "The external-reference layer now blocks regressions in:\n\n"
          assert text.count(marker) == 1
          text = text.replace(
              marker,
              marker + "- direct C1 private-engine calibration, inference, smoother/influence and independent-location prediction paths;\n",
          )
          source_marker = "- `tests/reference_data/gwr/` — frozen external outputs consumed by CI;"
          assert text.count(source_marker) == 1
          text = text.replace(
              source_marker,
              "- `tests/test_gwr_engine_numerical_lock.py` — C2 direct private-engine blocking reference lock;\n" + source_marker,
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit bookkeeping
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 00_REFACTOR_HANDOFF.md ARCHITECTURE_FINAL_DECISION.md validation_results/gwr/GWR_VALIDATION_EVIDENCE.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record C2 GWR engine numerical lock completion'
          git push origin HEAD:docs/c2-gwr-engine-numerical-lock-bookkeeping
