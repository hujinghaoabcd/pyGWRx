name: Temporary refactor GWR solver

on:
  push:
    branches: [refactor-gwr-unpenalized-solver]

permissions:
  contents: write

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  MPLBACKEND: "Agg"

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor-gwr-unpenalized-solver
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Refactor default WLS and bandwidth scoring
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          def replace_function(text, name, next_name, body):
              pattern = rf"def {name}\([\s\S]*?(?=def {next_name}\()"
              out, count = re.subn(pattern, body.rstrip() + "\n\n\n", text, count=1)
              if count != 1:
                  raise SystemExit(f"replace {name}: {count}")
              return out

          solver_path = Path("src/pygwrx/core/solver.py")
          solver = solver_path.read_text(encoding="utf-8")
          solver = solver.replace("_DEFAULT_RIDGE = 1e-8", "_DEFAULT_RIDGE = 0.0", 1)
          wls = '''def weighted_least_squares(
              X: np.ndarray,
              y: np.ndarray,
              weights: np.ndarray,
              *,
              ridge: float = _DEFAULT_RIDGE,
          ) -> Tuple[np.ndarray, np.ndarray]:
              """Solve weighted least squares from ``sqrt(W) @ X``.

              The default ``ridge=0.0`` is standard unpenalized WLS. Positive values
              remain an explicit lower-level ridge option.
              """
              X_arr = _validate_design_matrix(X)
              y_arr = _validate_response(y, X_arr.shape[0])
              weights_arr = _validate_weights(weights, X_arr.shape[0])
              ridge_value = _validate_nonnegative_scalar(ridge, "ridge")
              positive = weights_arr > 0.0
              sqrt_w = np.sqrt(weights_arr[positive])
              Xw = X_arr[positive] * sqrt_w[:, None]
              yw = y_arr[positive] * sqrt_w
              if ridge_value > 0.0:
                  design = np.vstack(
                      [Xw, np.sqrt(ridge_value) * np.eye(X_arr.shape[1], dtype=float)]
                  )
                  response = np.concatenate(
                      [yw, np.zeros(X_arr.shape[1], dtype=float)]
                  )
              else:
                  design = Xw
                  response = yw
              beta = np.linalg.lstsq(design, response, rcond=None)[0]
              _, singular_values, vt = np.linalg.svd(design, full_matrices=False)
              if singular_values.size == 0 or singular_values[0] <= 0.0:
                  raise np.linalg.LinAlgError("Weighted design has zero numerical rank.")
              cutoff = np.finfo(float).eps * max(design.shape) * singular_values[0]
              retained = singular_values > cutoff
              v = vt[retained].T
              inverse_normal = (
                  v * (1.0 / singular_values[retained] ** 2)
              ) @ v.T
              inverse_normal = 0.5 * (inverse_normal + inverse_normal.T)
              if not np.all(np.isfinite(beta)) or not np.all(np.isfinite(inverse_normal)):
                  raise np.linalg.LinAlgError("Weighted SVD solve produced non-finite values.")
              return np.asarray(beta, dtype=float), inverse_normal
          '''
          wls = re.sub(r"^          ", "", wls, flags=re.M)
          solver = replace_function(
              solver, "weighted_least_squares", "local_regression", wls
          )
          solver = solver.replace(
              "Returning a ridge-regularized local solution; consider increasing ",
              "Returning a minimum-norm unpenalized local solution; consider increasing ",
          )
          solver = solver.replace(
              "The corresponding hat-matrix row is ridge regularized.",
              "The corresponding hat-matrix row uses the unpenalized WLS operator.",
          )
          solver_path.write_text(solver, encoding="utf-8", newline="\n")

          bandwidth_path = Path("src/pygwrx/core/bandwidth.py")
          bandwidth = bandwidth_path.read_text(encoding="utf-8")
          bandwidth = bandwidth.replace(
              "import numpy as np\n",
              "import numpy as np\n\nfrom pygwrx.core.solver import weighted_least_squares\n",
              1,
          )
          bandwidth = bandwidth.replace("_RIDGE = 1e-8", "_RIDGE = 0.0", 1)
          local = '''def _fit_local_model(
              X: np.ndarray,
              y: np.ndarray,
              weights: np.ndarray,
              *,
              target_row: Optional[np.ndarray] = None,
          ) -> tuple[np.ndarray, Optional[np.ndarray]]:
              """Fit an unpenalized local weighted model for bandwidth scoring."""
              n_features = X.shape[1]
              positive = weights > 0.0
              if np.count_nonzero(positive) < n_features:
                  raise _InvalidCandidateError(
                      "Candidate bandwidth supplies fewer positive-weight observations than design columns."
                  )
              Xw = X[positive] * np.sqrt(weights[positive])[:, None]
              if np.linalg.matrix_rank(Xw) < n_features:
                  raise _InvalidCandidateError(
                      "Candidate bandwidth produces a rank-deficient weighted design."
                  )
              try:
                  beta, inverse_normal = weighted_least_squares(X, y, weights, ridge=0.0)
              except np.linalg.LinAlgError as exc:
                  raise _InvalidCandidateError("Local weighted solve failed.") from exc
              if target_row is None:
                  return beta, None
              hat_row = target_row @ inverse_normal @ (X.T * weights)
              if not np.all(np.isfinite(hat_row)):
                  raise _InvalidCandidateError("Hat-matrix row contains invalid values.")
              return beta, hat_row
          '''
          local = re.sub(r"^          ", "", local, flags=re.M)
          bandwidth = replace_function(
              bandwidth, "_fit_local_model", "_integer_grid", local
          )
          bandwidth_path.write_text(bandwidth, encoding="utf-8", newline="\n")

          gwr_path = Path("src/pygwrx/models/gwr.py")
          gwr = gwr_path.read_text(encoding="utf-8")
          gwr = gwr.replace(
              "solution is ridge regularized; consider increasing the bandwidth.",
              "solution uses a minimum-norm unpenalized WLS estimate; consider increasing the bandwidth or checking local collinearity.",
              1,
          )
          gwr_path.write_text(gwr, encoding="utf-8", newline="\n")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          changelog = changelog.replace(
              "## [Unreleased]\n\n",
              "## [Unreleased]\n\n### Changed\n- Changed the shared local weighted-least-squares default from an implicit `1e-8` ridge penalty to standard unpenalized WLS estimated from `sqrt(W) @ X`; positive ridge remains an explicit lower-level opt-in.\n- Aligned GWR calibration, prediction, and bandwidth scoring on the same unpenalized WLS semantics.\n\n",
              1,
          )
          changelog_path.write_text(changelog, encoding="utf-8", newline="\n")

          guide_path = Path("docs/guides/core-numerics.md")
          guide = guide_path.read_text(encoding="utf-8")
          guide = guide.replace(
              "## Local solvers\n\n",
              "## Local solvers\n\nThe standard solver is unpenalized weighted least squares. Coefficients are estimated from `sqrt(W) @ X` using SVD-backed least squares, exact zero weights are preserved, and no hidden ridge penalty is added. The low-level `ridge=` argument remains an explicit opt-in.\n\n",
              1,
          )
          guide_path.write_text(guide, encoding="utf-8", newline="\n")

          Path("tests/test_solver_unpenalized.py").write_text(
              '''"""Tests for the unpenalized weighted least-squares core."""\n\nimport numpy as np\n\nfrom pygwrx.core import weighted_least_squares\n\n\ndef test_default_matches_weighted_lstsq():\n    rng = np.random.default_rng(123)\n    X = np.column_stack([np.ones(12), rng.normal(size=(12, 2))])\n    y = rng.normal(size=12)\n    w = np.array([1., .8, 0., .4, 1.2, .6, .2, 0., 1.5, .7, .9, .3])\n    beta, inverse_normal = weighted_least_squares(X, y, w)\n    sw = np.sqrt(w); Xw = X * sw[:, None]; yw = y * sw\n    np.testing.assert_allclose(beta, np.linalg.lstsq(Xw, yw, rcond=None)[0], rtol=1e-11, atol=1e-12)\n    np.testing.assert_allclose(inverse_normal, np.linalg.pinv(Xw.T @ Xw, hermitian=True), rtol=1e-9, atol=1e-11)\n\n\ndef test_rank_deficient_default_is_minimum_norm():\n    x = np.linspace(-2., 2., 9); X = np.column_stack([np.ones_like(x), x, 2*x]); y = 3. + 4*x; w = np.linspace(.3, 1.1, x.size)\n    beta, _ = weighted_least_squares(X, y, w); sw = np.sqrt(w)\n    expected = np.linalg.lstsq(X * sw[:, None], y * sw, rcond=None)[0]\n    np.testing.assert_allclose(beta, expected, rtol=1e-11, atol=1e-12)\n\n\ndef test_explicit_ridge_still_matches_closed_form():\n    rng = np.random.default_rng(7); X = np.column_stack([np.ones(10), rng.normal(size=(10, 2))]); y = rng.normal(size=10); w = np.linspace(.2, 1.3, 10); ridge = .25\n    beta, inverse_normal = weighted_least_squares(X, y, w, ridge=ridge)\n    system = X.T @ (w[:, None] * X) + ridge * np.eye(X.shape[1])\n    np.testing.assert_allclose(beta, np.linalg.solve(system, X.T @ (w*y)), rtol=1e-11, atol=1e-12)\n    np.testing.assert_allclose(inverse_normal, np.linalg.inv(system), rtol=1e-10, atol=1e-11)\n\n\ndef test_feature_rescaling_preserves_fitted_values():\n    rng = np.random.default_rng(77); X = np.column_stack([np.ones(30), rng.normal(size=30), rng.normal(size=30)]); y = 1.5 + 2*X[:, 1] - .4*X[:, 2] + rng.normal(0., .01, 30); w = np.exp(-np.linspace(0., 2., 30))\n    beta, _ = weighted_least_squares(X, y, w); X2 = X.copy(); X2[:, 1] *= 1e4; X2[:, 2] *= 1e-4; beta2, _ = weighted_least_squares(X2, y, w)\n    np.testing.assert_allclose(X2 @ beta2, X @ beta, rtol=1e-8, atol=1e-9)\n''', encoding="utf-8", newline="\n")
          PY

      - name: Install and validate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,reference]"
          python -m black src/pygwrx/core/solver.py src/pygwrx/core/bandwidth.py src/pygwrx/models/gwr.py tests/test_solver_unpenalized.py
          python -m isort src/pygwrx/core/solver.py src/pygwrx/core/bandwidth.py src/pygwrx/models/gwr.py tests/test_solver_unpenalized.py
          python tools/generate_example_docs.py
          python tools/generate_api_docs.py
          python -m pytest -q tests/test_solver_unpenalized.py
          python -m pytest -q tests/test_gwr_external_references.py tests/test_gwr_columbus_reference.py
          python -m pytest -q tests/test_gwr*.py -m "not reference"
          python -m ruff check src/pygwrx/core/solver.py src/pygwrx/core/bandwidth.py src/pygwrx/models/gwr.py tests/test_solver_unpenalized.py
          python -m mypy
          git diff --check

      - name: Commit validated refactor
        run: |
          set -euo pipefail
          rm .github/workflows/_temporary_refactor_gwr_solver.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Use unpenalized SVD solver for standard GWR"
          git pull --rebase origin refactor-gwr-unpenalized-solver
          git push origin HEAD:refactor-gwr-unpenalized-solver
