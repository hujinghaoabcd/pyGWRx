name: Temporary refactor GWR solver

on:
  push:
    branches: [refactor-gwr-unpenalized-solver]

permissions:
  contents: write

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  MPLBACKEND: "Agg"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor-gwr-unpenalized-solver
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Apply numerical refactor
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_function(text, start_name, next_name, new_text):
              pattern = rf"def {start_name}\([\s\S]*?(?=def {next_name}\()"
              out, n = re.subn(pattern, new_text.rstrip() + "\n\n\n", text, count=1)
              if n != 1:
                  raise SystemExit(f"failed replacing {start_name}: {n}")
              return out

          solver_path = Path("src/pygwrx/core/solver.py")
          solver = solver_path.read_text(encoding="utf-8")
          if "_DEFAULT_RIDGE = 1e-8" not in solver:
              raise SystemExit("unexpected solver ridge default")
          solver = solver.replace("_DEFAULT_RIDGE = 1e-8", "_DEFAULT_RIDGE = 0.0", 1)

          wls = '''def weighted_least_squares(
              X: np.ndarray,
              y: np.ndarray,
              weights: np.ndarray,
              *,
              ridge: float = _DEFAULT_RIDGE,
          ) -> Tuple[np.ndarray, np.ndarray]:
              """Solve weighted least squares from the weighted design matrix.

              ``ridge=0.0`` is standard unpenalized WLS. Positive ridge values are an
              explicit lower-level opt-in and are represented by an augmented design.
              """
              X_arr = _validate_design_matrix(X)
              y_arr = _validate_response(y, X_arr.shape[0])
              weights_arr = _validate_weights(weights, X_arr.shape[0])
              ridge_value = _validate_nonnegative_scalar(ridge, "ridge")

              positive = weights_arr > 0.0
              sqrt_w = np.sqrt(weights_arr[positive])
              Xw = X_arr[positive] * sqrt_w[:, None]
              yw = y_arr[positive] * sqrt_w
              if ridge_value > 0.0:
                  design = np.vstack(
                      [Xw, np.sqrt(ridge_value) * np.eye(X_arr.shape[1], dtype=float)]
                  )
                  response = np.concatenate(
                      [yw, np.zeros(X_arr.shape[1], dtype=float)]
                  )
              else:
                  design = Xw
                  response = yw

              beta = np.linalg.lstsq(design, response, rcond=None)[0]
              _, singular_values, vt = np.linalg.svd(design, full_matrices=False)
              if singular_values.size == 0 or singular_values[0] <= 0.0:
                  raise np.linalg.LinAlgError(
                      "The weighted least-squares design has zero numerical rank."
                  )
              cutoff = (
                  np.finfo(float).eps
                  * max(design.shape)
                  * float(singular_values[0])
              )
              retained = singular_values > cutoff
              v = vt[retained].T
              inverse_normal = (
                  v * (1.0 / singular_values[retained] ** 2)
              ) @ v.T
              inverse_normal = 0.5 * (inverse_normal + inverse_normal.T)
              if not np.all(np.isfinite(beta)) or not np.all(np.isfinite(inverse_normal)):
                  raise np.linalg.LinAlgError(
                      "The weighted least-squares SVD produced non-finite values."
                  )
              return np.asarray(beta, dtype=float), inverse_normal
          '''
          wls = re.sub(r"^          ", "", wls, flags=re.M)
          # Remove the two old normal-equation helpers and replace WLS itself in one span.
          solver, n = re.subn(
              r"def _normal_equations\([\s\S]*?(?=def local_regression\()",
              wls.rstrip() + "\n\n\n",
              solver,
              count=1,
          )
          if n != 1:
              raise SystemExit(f"failed replacing WLS span: {n}")

          # local_regression already calls weighted_least_squares; update semantics/docs only.
          solver = solver.replace(
              "Returning a ridge-regularized local solution; consider increasing ",
              "Returning a minimum-norm unpenalized local solution; consider increasing ",
          )
          solver = solver.replace(
              "ridge: Non-negative regularization shared with ``compute_hat_matrix``.",
              "ridge: Optional non-negative ridge penalty. The default ``0.0`` is unpenalized WLS.",
              1,
          )
          solver = solver.replace(
              "the function emits a warning and returns the deterministic ridge-regularized\n        solution.",
              "the function emits a warning and returns the minimum-norm unpenalized\n        solution when ``ridge=0.0``.",
              1,
          )

          hat = '''def compute_hat_matrix(
              X: np.ndarray,
              coords: np.ndarray,
              kernel_func: KernelFunction,
              bandwidth: float,
              distance_metric: str = "euclidean",
              adaptive: bool = False,
              *,
              ridge: float = _DEFAULT_RIDGE,
          ) -> np.ndarray:
              """Compute the GWR smoother matrix ``S`` such that ``y_hat = S @ y``.

              The default uses the same unpenalized weighted-SVD semantics as
              :func:`weighted_least_squares`. Positive ``ridge`` remains explicit.
              """
              from pygwrx.core.utils import compute_distance_matrix

              X_arr = _validate_design_matrix(X)
              coords_arr = _validate_coordinates(
                  coords, name="coords", expected_rows=X_arr.shape[0]
              )
              kernel = _validate_kernel(kernel_func)
              ridge_value = _validate_nonnegative_scalar(ridge, "ridge")
              if not isinstance(adaptive, (bool, np.bool_)):
                  raise TypeError("adaptive must be a boolean.")
              adaptive_value = bool(adaptive)
              if adaptive_value:
                  bandwidth_value: Union[float, int] = _validate_adaptive_k(
                      bandwidth, X_arr.shape[0]
                  )
              else:
                  bandwidth_value = _validate_fixed_bandwidth(bandwidth)

              distances = np.asarray(
                  compute_distance_matrix(coords_arr, coords_arr, metric=distance_metric),
                  dtype=float,
              )
              expected_shape = (X_arr.shape[0], X_arr.shape[0])
              if distances.shape != expected_shape:
                  raise ValueError(
                      "compute_distance_matrix returned an unexpected shape; "
                      f"expected {expected_shape}, got {distances.shape}."
                  )
              if not np.all(np.isfinite(distances)) or np.any(distances < 0):
                  raise ValueError("Distance calculation produced invalid values.")

              hat_matrix = np.empty(expected_shape, dtype=float)
              dummy_y = np.zeros(X_arr.shape[0], dtype=float)
              for i, dists in enumerate(distances):
                  try:
                      weights = _compute_kernel_weights(
                          dists, kernel, bandwidth_value, adaptive=adaptive_value
                      )
                      n_positive = int(np.count_nonzero(weights > 0.0))
                      if n_positive < X_arr.shape[1]:
                          warnings.warn(
                              f"Location {i}: only {n_positive} positive-weight observations "
                              f"are available for {X_arr.shape[1]} design-matrix columns. "
                              "The smoother row uses a minimum-norm WLS operator.",
                              RuntimeWarning,
                              stacklevel=2,
                          )
                      _, inverse_normal = weighted_least_squares(
                          X_arr, dummy_y, weights, ridge=ridge_value
                      )
                      hat_row = X_arr[i] @ inverse_normal @ (X_arr.T * weights)
                      if not np.all(np.isfinite(hat_row)):
                          raise np.linalg.LinAlgError(
                              "The hat-matrix row contains non-finite values."
                          )
                      hat_matrix[i] = hat_row
                  except (ValueError, TypeError, np.linalg.LinAlgError) as exc:
                      raise RuntimeError(
                          f"Hat-matrix computation failed at location {i}: {exc}"
                      ) from exc
              return hat_matrix
          '''
          hat = re.sub(r"^          ", "", hat, flags=re.M)
          solver = replace_function(
              solver, "compute_hat_matrix", "adaptive_bandwidth_weights", hat
          )
          solver_path.write_text(solver, encoding="utf-8", newline="\n")

          bandwidth_path = Path("src/pygwrx/core/bandwidth.py")
          bandwidth = bandwidth_path.read_text(encoding="utf-8")
          bandwidth = bandwidth.replace(
              "import numpy as np\n",
              "import numpy as np\n\nfrom pygwrx.core.solver import weighted_least_squares\n",
              1,
          )
          if "_RIDGE = 1e-8" not in bandwidth:
              raise SystemExit("unexpected bandwidth ridge default")
          bandwidth = bandwidth.replace("_RIDGE = 1e-8", "_RIDGE = 0.0", 1)
          fit_local = '''def _fit_local_model(
              X: np.ndarray,
              y: np.ndarray,
              weights: np.ndarray,
              *,
              target_row: Optional[np.ndarray] = None,
          ) -> tuple[np.ndarray, Optional[np.ndarray]]:
              """Fit one unpenalized local weighted model."""
              n_features = X.shape[1]
              positive = weights > 0.0
              if np.count_nonzero(positive) < n_features:
                  raise _InvalidCandidateError(
                      "Candidate bandwidth supplies fewer positive-weight observations than "
                      "design-matrix columns."
                  )
              Xw = X[positive] * np.sqrt(weights[positive])[:, None]
              if np.linalg.matrix_rank(Xw) < n_features:
                  raise _InvalidCandidateError(
                      "Candidate bandwidth produces a rank-deficient weighted design."
                  )
              try:
                  beta, inverse_normal = weighted_least_squares(
                      X, y, weights, ridge=0.0
                  )
              except np.linalg.LinAlgError as exc:
                  raise _InvalidCandidateError("Local weighted solve failed.") from exc
              if target_row is None:
                  return beta, None
              hat_row = target_row @ inverse_normal @ (X.T * weights)
              if not np.all(np.isfinite(hat_row)):
                  raise _InvalidCandidateError("Hat-matrix row contains invalid values.")
              return beta, hat_row
          '''
          fit_local = re.sub(r"^          ", "", fit_local, flags=re.M)
          bandwidth = replace_function(
              bandwidth, "_fit_local_model", "_integer_grid", fit_local
          )
          bandwidth_path.write_text(bandwidth, encoding="utf-8", newline="\n")

          gwr_path = Path("src/pygwrx/models/gwr.py")
          gwr = gwr_path.read_text(encoding="utf-8")
          gwr = gwr.replace(
              "solution is ridge regularized; consider increasing the bandwidth.",
              "solution uses a minimum-norm unpenalized WLS estimate; consider increasing the bandwidth or checking local collinearity.",
              1,
          )
          gwr_path.write_text(gwr, encoding="utf-8", newline="\n")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          changelog = changelog.replace(
              "## [Unreleased]\n\n",
              "## [Unreleased]\n\n### Changed\n- Changed the shared local weighted-least-squares default from an implicit `1e-8` ridge penalty to standard unpenalized WLS estimated from `sqrt(W) @ X`. Positive ridge values remain an explicit lower-level opt-in.\n- Aligned GWR calibration, prediction, smoother construction, and bandwidth scoring on the same unpenalized WLS semantics.\n\n",
              1,
          )
          changelog_path.write_text(changelog, encoding="utf-8", newline="\n")

          guide_path = Path("docs/guides/core-numerics.md")
          guide = guide_path.read_text(encoding="utf-8")
          guide = guide.replace(
              "## Local solvers\n\n",
              "## Local solvers\n\nThe standard solver is unpenalized weighted least squares. It estimates coefficients from `sqrt(W) @ X` using SVD-backed least squares, preserves exact zero weights, and does not add hidden ridge regularization. The low-level `ridge=` argument remains an explicit opt-in.\n\n",
              1,
          )
          guide_path.write_text(guide, encoding="utf-8", newline="\n")

          Path("tests/test_solver_unpenalized.py").write_text(
              '''"""Tests for the unpenalized weighted least-squares core."""\n\nimport numpy as np\n\nfrom pygwrx.core import compute_hat_matrix, gaussian_kernel, local_regression, weighted_least_squares\n\n\ndef test_default_matches_weighted_lstsq():\n    rng = np.random.default_rng(123)\n    X = np.column_stack([np.ones(12), rng.normal(size=(12, 2))])\n    y = rng.normal(size=12)\n    w = np.array([1., .8, 0., .4, 1.2, .6, .2, 0., 1.5, .7, .9, .3])\n    beta, inverse_normal = weighted_least_squares(X, y, w)\n    sw = np.sqrt(w); Xw = X * sw[:, None]; yw = y * sw\n    np.testing.assert_allclose(beta, np.linalg.lstsq(Xw, yw, rcond=None)[0], rtol=1e-11, atol=1e-12)\n    np.testing.assert_allclose(inverse_normal, np.linalg.pinv(Xw.T @ Xw, hermitian=True), rtol=1e-9, atol=1e-11)\n\n\ndef test_rank_deficient_default_is_minimum_norm():\n    x = np.linspace(-2., 2., 9); X = np.column_stack([np.ones_like(x), x, 2*x]); y = 3. + 4*x; w = np.linspace(.3, 1.1, x.size)\n    beta, _ = weighted_least_squares(X, y, w)\n    sw = np.sqrt(w)\n    expected = np.linalg.lstsq(X * sw[:, None], y * sw, rcond=None)[0]\n    np.testing.assert_allclose(beta, expected, rtol=1e-11, atol=1e-12)\n\n\ndef test_explicit_ridge_still_matches_closed_form():\n    rng = np.random.default_rng(7); X = np.column_stack([np.ones(10), rng.normal(size=(10, 2))]); y = rng.normal(size=10); w = np.linspace(.2, 1.3, 10); ridge = .25\n    beta, inverse_normal = weighted_least_squares(X, y, w, ridge=ridge)\n    system = X.T @ (w[:, None] * X) + ridge * np.eye(X.shape[1])\n    np.testing.assert_allclose(beta, np.linalg.solve(system, X.T @ (w*y)), rtol=1e-11, atol=1e-12)\n    np.testing.assert_allclose(inverse_normal, np.linalg.inv(system), rtol=1e-10, atol=1e-11)\n\n\ndef test_feature_rescaling_preserves_fitted_values():\n    rng = np.random.default_rng(77); X = np.column_stack([np.ones(30), rng.normal(size=30), rng.normal(size=30)]); y = 1.5 + 2*X[:, 1] - .4*X[:, 2] + rng.normal(0., .01, 30); w = np.exp(-np.linspace(0., 2., 30))\n    beta, _ = weighted_least_squares(X, y, w); X2 = X.copy(); X2[:, 1] *= 1e4; X2[:, 2] *= 1e-4; beta2, _ = weighted_least_squares(X2, y, w)\n    np.testing.assert_allclose(X2 @ beta2, X @ beta, rtol=1e-8, atol=1e-9)\n\n\ndef test_hat_matrix_matches_local_training_fits():\n    rng = np.random.default_rng(19); coords = rng.uniform(0., 5., size=(18, 2)); x = rng.normal(size=18); X = np.column_stack([np.ones(18), x]); y = 2. + 1.3*x + rng.normal(0., .05, 18)\n    params = local_regression(X, y, coords, coords, gaussian_kernel, 2.5); hat = compute_hat_matrix(X, coords, gaussian_kernel, 2.5)\n    np.testing.assert_allclose(hat @ y, np.einsum("ij,ij->i", X, params), rtol=1e-10, atol=1e-10)\n''', encoding="utf-8", newline="\n")
          PY

      - name: Install, format, and validate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,reference]"
          python -m black src/pygwrx/core/solver.py src/pygwrx/core/bandwidth.py src/pygwrx/models/gwr.py tests/test_solver_unpenalized.py
          python -m isort src/pygwrx/core/solver.py src/pygwrx/core/bandwidth.py src/pygwrx/models/gwr.py tests/test_solver_unpenalized.py
          python tools/generate_example_docs.py
          python tools/generate_api_docs.py
          python -m pytest -q tests/test_solver_unpenalized.py
          python -m pytest -q tests/test_gwr_external_references.py tests/test_gwr_columbus_reference.py
          python -m pytest -q tests/test_gwr*.py -m "not reference"
          python -m ruff check src/pygwrx/core/solver.py src/pygwrx/core/bandwidth.py src/pygwrx/models/gwr.py tests/test_solver_unpenalized.py
          python -m mypy
          git diff --check

      - name: Commit refactor
        run: |
          set -euo pipefail
          rm .github/workflows/_temporary_refactor_gwr_solver.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Use unpenalized SVD solver for standard GWR"
          git pull --rebase origin refactor-gwr-unpenalized-solver
          git push origin HEAD:refactor-gwr-unpenalized-solver
