name: A5 ledger one-shot

on:
  push:
    branches:
      - docs/a5-ledger-handoff
    paths:
      - .github/workflows/a5-ledger-once.yml

permissions:
  contents: write

jobs:
  update-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/a5-ledger-handoff
          fetch-depth: 0

      - name: Update A5 ledger row
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("ARCHITECTURE_FINAL_DECISION.md")
          text = path.read_text(encoding="utf-8")
          old = "| A5 | pre-refactor contract/message hygiene | PENDING | — | — | model tests | 含 GTWR misleading ridge warning |"
          new = "| A5 | pre-refactor contract/message hygiene | DONE | #40 | `595a632076025eb9b45794caaff37e3b3747a700` | model tests + full CI | 修正 GTWR misleading ridge warning；新增 minimum-norm warning contract test；无算法/solver 变更 |"
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one A5 ledger row, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          Path(".github/workflows/a5-ledger-once.yml").unlink()
          PY

      - name: Commit ledger update and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ARCHITECTURE_FINAL_DECISION.md .github/workflows/a5-ledger-once.yml
          git commit -m "Record A5 completion in architecture ledger"
          git push origin HEAD:docs/a5-ledger-handoff
