name: Temporary EDF roundoff fix
on:
  push:
    branches: [refactor-gwr-unpenalized-solver]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor-gwr-unpenalized-solver
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python tools/_temporary_fix_edf_roundoff.py
      - run: python -m pip install -e ".[dev,reference]"
      - run: python -m black src/pygwrx/core/metrics.py tests/test_metrics.py
      - run: python -m isort src/pygwrx/core/metrics.py tests/test_metrics.py
      - run: python -m pytest -q tests/test_metrics.py
      - run: python -m pytest -q tests/test_gwr_external_references.py::test_aicc_rejects_saturated_k4_boundary
      - run: python -m pytest -q -m reference
      - run: python -m ruff check src/pygwrx/core/metrics.py tests/test_metrics.py
      - name: Commit fix
        run: |
          rm .github/workflows/_temporary_fix_edf_roundoff.yml
          rm tools/_temporary_fix_edf_roundoff.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Clamp roundoff-scale negative GWR EDF"
          git pull --rebase origin refactor-gwr-unpenalized-solver
          git push origin HEAD:refactor-gwr-unpenalized-solver
