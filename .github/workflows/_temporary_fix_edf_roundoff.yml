name: Temporary fix EDF roundoff

on:
  push:
    branches: [refactor-gwr-unpenalized-solver]

permissions:
  contents: write

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  MPLBACKEND: "Agg"

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor-gwr-unpenalized-solver
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Clamp only machine-roundoff negative EDF
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/pygwrx/core/metrics.py")
          text = path.read_text(encoding="utf-8")
          old = '''    trace_s_value = _validate_nonnegative_scalar(trace_S, "trace_S")
    trace_sts_value = _validate_nonnegative_scalar(trace_StS, "trace_StS")
    return float(n_value - 2.0 * trace_s_value + trace_sts_value)
'''
          new = '''    trace_s_value = _validate_nonnegative_scalar(trace_S, "trace_S")
    trace_sts_value = _validate_nonnegative_scalar(trace_StS, "trace_StS")
    edf = float(n_value - 2.0 * trace_s_value + trace_sts_value)

    # A saturated smoother can have theoretical EDF == 0 while independent
    # floating-point trace calculations leave a tiny negative residue. Clamp only
    # machine-roundoff-scale negative zero; materially negative EDF values remain
    # negative so downstream validation still rejects an invalid diagnostic state.
    roundoff_tolerance = (
        16.0
        * np.finfo(float).eps
        * max(
            1.0,
            float(n_value),
            2.0 * abs(trace_s_value),
            abs(trace_sts_value),
        )
    )
    if -roundoff_tolerance <= edf < 0.0:
        return 0.0
    return edf
'''
          if old not in text:
              raise SystemExit("compute_edf target block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,reference]"
          python -m black src/pygwrx/core/metrics.py tests/test_metrics.py
          python -m isort src/pygwrx/core/metrics.py tests/test_metrics.py
          python -m pytest -q tests/test_metrics.py
          python -m pytest -q tests/test_gwr_external_references.py::test_aicc_rejects_saturated_k4_boundary
          python -m pytest -q -m reference
          python -m ruff check src/pygwrx/core/metrics.py tests/test_metrics.py
          python -m mypy
          git diff --check
      - name: Commit fix
        run: |
          rm .github/workflows/_temporary_fix_edf_roundoff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Clamp roundoff-scale negative GWR EDF"
          git pull --rebase origin refactor-gwr-unpenalized-solver
          git push origin HEAD:refactor-gwr-unpenalized-solver
