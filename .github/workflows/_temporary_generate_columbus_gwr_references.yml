name: Temporary Columbus GWR reference generation

on:
  push:
    branches: [gwr-reference-validation]

permissions:
  contents: write

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gwr-reference-validation
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python reference environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,reference]"
          python - <<'PY'
          import mgwr
          print("mgwr", mgwr.__version__)
          assert mgwr.__version__ == "2.2.1"
          PY

      - name: Generate Python Columbus references
        run: |
          python tools/reference/gwr/generate_columbus_mgwr.py
          python tools/reference/gwr/generate_columbus_bandwidth_curves.py

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::sp
            any::GWmodel
            any::spgwr
          cache-version: 1

      - name: Record R reference versions
        shell: Rscript {0}
        run: |
          cat("GWmodel", as.character(packageVersion("GWmodel")), "\n")
          cat("spgwr", as.character(packageVersion("spgwr")), "\n")

      - name: Generate R Columbus references
        run: Rscript tools/reference/gwr/generate_columbus_r_references.R

      - name: Compare and finalize Columbus validation
        run: |
          python tools/reference/gwr/compare_columbus_references.py
          python tools/reference/gwr/finalize_columbus_validation.py

      - name: Commit compact frozen fixtures and reports
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/reference_data/gwr/real_columbus/frozen validation_results/gwr/real_columbus
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No Columbus validation changes to commit."
          else
            git commit -m "Freeze Columbus real-data GWR validation [skip ci]"
            git push origin HEAD:gwr-reference-validation
          fi

      - name: List generated references and reports
        run: |
          find tests/reference_data/gwr/real_columbus -maxdepth 2 -type f -print -exec wc -c {} \;
          find validation_results/gwr/real_columbus -maxdepth 1 -type f -print -exec wc -c {} \;

      - uses: actions/upload-artifact@v7
        with:
          name: gwr-columbus-real-data-validation
          path: |
            tests/reference_data/gwr/real_columbus/
            validation_results/gwr/real_columbus/
          if-no-files-found: error
          retention-days: 7
