name: Temporary restore generated example output

on:
  push:
    branches:
      - adaptive-bandwidth-exhaustive-search

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: adaptive-bandwidth-exhaustive-search
          fetch-depth: 0
      - name: Restore unrelated generated binary and self-clean
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- examples/output/frame_results.parquet
          rm .github/workflows/_temporary_restore_example_output.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Restore unrelated generated example output"
          git push origin HEAD:adaptive-bandwidth-exhaustive-search
