name: C2 Black Format

on:
  push:
    branches:
      - refactor/c2-gwr-engine-numerical-lock

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/c2-gwr-engine-numerical-lock
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Black
        run: python -m pip install 'black>=24.0.0'
      - name: Format C2 test
        run: python -m black tests/test_gwr_engine_numerical_lock.py
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_gwr_engine_numerical_lock.py
          git commit -m 'style: format C2 GWR engine numerical lock'
          git push origin HEAD:refactor/c2-gwr-engine-numerical-lock
