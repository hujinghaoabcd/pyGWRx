name: Apply GWR freeze contract

on:
  push:
    branches:
      - fix/gwr-freeze-contract

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/gwr-freeze-contract
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Apply focused patch
        run: python tools/_apply_gwr_freeze_contract.py
      - name: Format and test GWR freeze contract
        run: |
          python -m pip install -e ".[test]" black isort
          python -m black src/pygwrx/core/base.py src/pygwrx/models/gwr.py tests/test_gwr_freeze_contract.py
          python -m isort src/pygwrx/core/base.py src/pygwrx/models/gwr.py tests/test_gwr_freeze_contract.py
          python -m pytest -q tests/test_gwr_freeze_contract.py tests/test_gwr_distance_streaming.py tests/test_gwr_bandwidth_provenance.py
      - name: Commit clean branch state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-gwr-freeze-contract.yml
          git rm tools/_apply_gwr_freeze_contract.py
          git add src/pygwrx/core/base.py src/pygwrx/models/gwr.py docs/models/gwr.md tests/test_gwr_freeze_contract.py
          git commit -m "Harden standard GWR freeze contract"
          git push origin HEAD:fix/gwr-freeze-contract
