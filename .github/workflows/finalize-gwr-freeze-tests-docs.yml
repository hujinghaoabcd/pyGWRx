name: Finalize GWR freeze tests and docs

on:
  push:
    branches:
      - fix/gwr-freeze-contract

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/gwr-freeze-contract
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Make hat-matrix expectations explicit
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tests/test_gwr_standard.py')
          s = p.read_text(encoding='utf-8')
          old = '    model.fit(synthetic["X"], synthetic["y"], synthetic["coords"])\n    assert model.S_matrix_ is model.hat_matrix_\n'
          new = '    model.fit(\n        synthetic["X"],\n        synthetic["y"],\n        synthetic["coords"],\n        compute_hat_matrix=True,\n    )\n    assert model.S_matrix_ is model.hat_matrix_\n'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('tests/test_lcr_gwr.py')
          s = p.read_text(encoding='utf-8')
          old = '    gwr = GWR(kernel="bisquare", bandwidth=22, adaptive=True).fit(\n        X, y, coords, compute_local_r2=False\n    )\n'
          new = '    gwr = GWR(kernel="bisquare", bandwidth=22, adaptive=True).fit(\n        X,\n        y,\n        coords,\n        compute_local_r2=False,\n        compute_hat_matrix=True,\n    )\n'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Regenerate API documentation
        run: |
          python -m pip install -e ".[dev]"
          python tools/generate_example_docs.py
          python tools/generate_api_docs.py
          python -m black tests/test_gwr_standard.py tests/test_lcr_gwr.py
          python -m isort tests/test_gwr_standard.py tests/test_lcr_gwr.py
      - name: Run focused regression tests
        run: |
          python -m pytest -q tests/test_gwr_freeze_contract.py tests/test_gwr_standard.py tests/test_lcr_gwr.py::test_zero_lambda_without_adjustment_reduces_to_gwr tests/test_gtwr.py::test_lambda_one_reduces_to_standard_gwr
      - name: Commit clean state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-gwr-freeze-tests-docs.yml
          git add tests/test_gwr_standard.py tests/test_lcr_gwr.py docs/api/models/gwr.md
          git commit -m "Align hat-matrix tests and generated GWR API docs"
          git push origin HEAD:fix/gwr-freeze-contract
