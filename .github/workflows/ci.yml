name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYTHONWARNINGS: "default"
  MPLBACKEND: "Agg"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install quality tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Black
        run: python -m black --check --diff src tests tools examples
      - name: isort
        run: python -m isort --check-only src tests tools examples
      - name: Ruff
        run: python -m ruff check src tests tools examples
      - name: Blocking typed-API gate
        run: python -m mypy
      - name: Verify generated documentation is current
        run: |
          python tools/generate_example_docs.py
          python tools/generate_api_docs.py
          git diff --exit-code

  test:
    name: Tests (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip check
      - name: Run platform suite batch 1
        run: python tools/run_tests.py --batch 1
      - name: Run platform suite batch 2
        run: python tools/run_tests.py --batch 2
      - name: Run platform suite batch 3
        run: python tools/run_tests.py --batch 3

  coverage:
    name: Coverage threshold
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Coverage batch 1
        run: python tools/run_coverage.py --batch 1
      - name: Coverage batch 2
        run: python tools/run_coverage.py --batch 2
      - name: Coverage batch 3
        run: python tools/run_coverage.py --batch 3
      - name: Combine coverage and enforce threshold
        run: python tools/run_coverage.py --combine
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  reference:
    name: Independent numerical references
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install reference environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,reference]"
          python -m pip check
      - name: Run reference-marked tests only
        run: python -m pytest -q -m reference

  oldest-dependencies:
    name: Declared minimum dependencies (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install declared minimum versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install \
            "numpy==1.25.2" \
            "scipy==1.11.4" \
            "pandas==2.0.3" \
            "matplotlib==3.7.2" \
            "geopandas==0.14.4" \
            "shapely==2.0.2" \
            "scikit-learn==1.3.2" \
            "pyarrow==14.0.1" \
            "pytest>=7.4" \
            "pytest-cov>=4.1"
          python -m pip check
      - name: Run non-reference batch 1
        run: python tools/run_tests.py --batch 1
      - name: Run non-reference batch 2
        run: python tools/run_tests.py --batch 2
      - name: Run non-reference batch 3
        run: python tools/run_tests.py --batch 3

  distributions:
    name: Build and isolated installation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          rm -rf build dist src/*.egg-info
          python -m build
          python -m twine check dist/*
      - name: Inspect wheel and sdist contents
        run: python tools/verify_distributions.py dist
      - name: Install and exercise wheel in an isolated environment
        shell: bash
        run: |
          ROOT="$PWD"
          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install --upgrade pip
          .venv-wheel/bin/python -m pip install dist/*.whl
          TMP=$(mktemp -d)
          (cd "$TMP" && "$ROOT/.venv-wheel/bin/python" "$ROOT/tools/smoke_installed_distribution.py")
          .venv-wheel/bin/python -m pip check
      - name: Install and exercise sdist in an isolated environment
        shell: bash
        run: |
          ROOT="$PWD"
          python -m venv .venv-sdist
          .venv-sdist/bin/python -m pip install --upgrade pip
          .venv-sdist/bin/python -m pip install dist/*.tar.gz
          TMP=$(mktemp -d)
          (cd "$TMP" && "$ROOT/.venv-sdist/bin/python" "$ROOT/tools/smoke_installed_distribution.py")
          .venv-sdist/bin/python -m pip check
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
