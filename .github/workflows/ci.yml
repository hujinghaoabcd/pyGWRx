name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYTHONWARNINGS: "default"
  MPLBACKEND: "Agg"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  a2-repair:
    name: A2 one-shot lifecycle repair
    if: github.event_name == 'pull_request' && github.head_ref == 'refactor/a2-fitted-state-atomicity'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/a2-fitted-state-atomicity
          fetch-depth: 0
      - name: Apply characterized lifecycle fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/pygwrx/core/base.py",
              "    def _mark_unfitted(self) -> None:\n        self._is_fitted = False\n",
              "    def _mark_unfitted(self) -> None:\n"
              "        self._is_fitted = False\n"
              "        self.n_samples_ = None\n"
              "        self.n_features_in_ = None\n"
              "        self.feature_names_in_ = None\n",
          )

          replace_once(
              "src/pygwrx/models/mgwr.py",
              "        for name, value in (\n"
              "            (\"compute_hat_matrix\", compute_hat_matrix),\n",
              "        self._reset_fit_state()\n"
              "        for name, value in (\n"
              "            (\"compute_hat_matrix\", compute_hat_matrix),\n",
          )
          replace_once(
              "src/pygwrx/models/mgwr.py",
              "\n        self._reset_fit_state()\n        try:\n"
              "            X_arr, y_arr, coords_arr = self._validate_inputs(X, y, coords)\n",
              "\n        try:\n"
              "            X_arr, y_arr, coords_arr = self._validate_inputs(X, y, coords)\n",
          )

          replace_once(
              "src/pygwrx/models/rgwr.py",
              "        self._validate_robust_parameters()\n"
              "        if compute_hat_matrix_flag is not None:\n",
              "        self._reset_fit_state()\n"
              "        self._validate_robust_parameters()\n"
              "        if compute_hat_matrix_flag is not None:\n",
          )
          replace_once(
              "src/pygwrx/models/rgwr.py",
              "        self._reset_fit_state()\n\n        try:\n"
              "            # Filtered RGWR needs the complete initial S matrix to reproduce the\n",
              "        try:\n"
              "            # Filtered RGWR needs the complete initial S matrix to reproduce the\n",
          )

          replace_once(
              "tests/test_estimator_fitted_state_atomicity.py",
              "def _bad_nan_refit(model: Any, X: np.ndarray, y: np.ndarray, coords: np.ndarray) -> None:\n"
              "    bad = X.copy()\n"
              "    bad[0, 0] = np.nan\n"
              "    model.fit(bad, y, coords)\n\n\n",
              "def _bad_nan_refit(model: Any, X: np.ndarray, y: np.ndarray, coords: np.ndarray) -> None:\n"
              "    bad = X.copy()\n"
              "    bad[0, 0] = np.nan\n"
              "    model.fit(bad, y, coords)\n\n\n"
              "def _bad_nan_unsupervised_refit(\n"
              "    model: Any, X: np.ndarray, coords: np.ndarray\n"
              ") -> None:\n"
              "    bad = X.copy()\n"
              "    bad[0, 0] = np.nan\n"
              "    model.fit(bad, coords)\n\n\n",
          )
          old = "            lambda model: model.fit(\n                np.where(np.indices(X.shape) == (0, 0), np.nan, X), coords\n            ),"
          new = "            lambda model: _bad_nan_unsupervised_refit(model, X, coords),"
          test_path = Path("tests/test_estimator_fitted_state_atomicity.py")
          text = test_path.read_text(encoding="utf-8")
          if text.count(old) != 2:
              raise SystemExit(f"expected two unsupervised NaN cases, found {text.count(old)}")
          test_path.write_text(text.replace(old, new), encoding="utf-8")
          PY

          python -m pip install --upgrade pip
          python -m pip install black isort ruff
          python -m isort tests/test_estimator_fitted_state_atomicity.py src/pygwrx/core/base.py src/pygwrx/models/mgwr.py src/pygwrx/models/rgwr.py
          python -m ruff check --fix tests/test_estimator_fitted_state_atomicity.py src/pygwrx/core/base.py src/pygwrx/models/mgwr.py src/pygwrx/models/rgwr.py
          python -m black tests/test_estimator_fitted_state_atomicity.py src/pygwrx/core/base.py src/pygwrx/models/mgwr.py src/pygwrx/models/rgwr.py
      - name: Commit real A2 fixes and remove repair job
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml src/pygwrx/core/base.py src/pygwrx/models/mgwr.py src/pygwrx/models/rgwr.py tests/test_estimator_fitted_state_atomicity.py
          git diff --cached --check
          git commit -m "Fix fitted-state atomicity gaps"
          git push origin HEAD:refactor/a2-fitted-state-atomicity

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install quality tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Black
        run: python -m black --check src tests tools examples
      - name: isort
        run: python -m isort --check-only src tests tools examples
      - name: Ruff
        run: python -m ruff check src tests tools examples
      - name: Blocking typed-API gate
        run: python -m mypy
      - name: Verify generated documentation is current
        run: |
          python tools/generate_example_docs.py
          python tools/generate_api_docs.py
          git diff --exit-code

  test:
    name: Tests (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip check
      - name: Run platform suite batch 1
        run: python tools/run_tests.py --batch 1
      - name: Run platform suite batch 2
        run: python tools/run_tests.py --batch 2
      - name: Run platform suite batch 3
        run: python tools/run_tests.py --batch 3

  coverage:
    name: Coverage threshold
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Coverage batch 1
        run: python tools/run_coverage.py --batch 1
      - name: Coverage batch 2
        run: python tools/run_coverage.py --batch 2
      - name: Coverage batch 3
        run: python tools/run_coverage.py --batch 3
      - name: Combine coverage and enforce threshold
        run: python tools/run_coverage.py --combine
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  reference:
    name: Independent numerical references
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install reference environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,reference]"
          python -m pip check
      - name: Run reference-marked tests only
        run: python -m pytest -q -m reference

  oldest-dependencies:
    name: Declared minimum dependencies (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install declared minimum versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install \
            "numpy==1.25.2" \
            "scipy==1.11.4" \
            "pandas==2.0.3" \
            "matplotlib==3.7.2" \
            "geopandas==0.14.4" \
            "shapely==2.0.2" \
            "scikit-learn==1.3.2" \
            "pyarrow==14.0.1" \
            "pytest>=7.4" \
            "pytest-cov>=4.1"
          python -m pip check
      - name: Run non-reference batch 1
        run: python tools/run_tests.py --batch 1
      - name: Run non-reference batch 2
        run: python tools/run_tests.py --batch 2
      - name: Run non-reference batch 3
        run: python tools/run_tests.py --batch 3

  distributions:
    name: Build and isolated installation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          rm -rf build dist src/*.egg-info
          python -m build
          python -m twine check dist/*
      - name: Inspect wheel and sdist contents
        run: python tools/verify_distributions.py dist
      - name: Install and exercise wheel in an isolated environment
        shell: bash
        run: |
          ROOT="$PWD"
          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install --upgrade pip
          .venv-wheel/bin/python -m pip install dist/*.whl
          TMP=$(mktemp -d)
          (cd "$TMP" && "$ROOT/.venv-wheel/bin/python" "$ROOT/tools/smoke_installed_distribution.py")
          .venv-wheel/bin/python -m pip check
      - name: Install and exercise sdist in an isolated environment
        shell: bash
        run: |
          ROOT="$PWD"
          python -m venv .venv-sdist
          .venv-sdist/bin/python -m pip install --upgrade pip
          .venv-sdist/bin/python -m pip install dist/*.tar.gz
          TMP=$(mktemp -d)
          (cd "$TMP" && "$ROOT/.venv-sdist/bin/python" "$ROOT/tools/smoke_installed_distribution.py")
          .venv-sdist/bin/python -m pip check
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
