name: C1 Bookkeeping Update

on:
  push:
    branches: [docs/c1-ledger-handoff]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/c1-ledger-handoff
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Update C1 ledger and handoff
        run: |
          python - <<'PY'
          from pathlib import Path

          handoff = Path("00_REFACTOR_HANDOFF.md")
          text = handoff.read_text(encoding="utf-8")
          marker = "- 下一项固定为：**C1 — GWR private engine extraction**。"
          replacement = (
              "- C1 — GWR private engine extraction：**DONE**，PR #59，merge SHA `69d2f441a29cf02976bc1b1502193da70c2b23e8`。新增 private `pygwrx.models._gwr_engine`，把 standard GWR 的 bandwidth objective、spatial-weight orchestration、Gaussian local WLS orchestration、prediction-location fitting、inference collection 与 rank-policy hook 从 public estimator shell 中提取；`GWR` public constructor/method/result/fitted-state contract 保持不变，现有受 RGWR 等依赖的 protected methods 仅保留为 thin compatibility wrappers，未提前执行 D1 concrete-inheritance cleanup。private-vs-public selector trace contracts、fitted-state atomicity、independent numerical references、coverage、minimum dependencies、build/install、Ubuntu/macOS/Windows × Python 3.11–3.14、Documentation 与 Security/SBOM 全部通过；未修改统计公式、search candidate/tie semantics、reference fixture 或 tolerance。\n"
              "- 下一项固定为：**C2 — GWR engine numerical lock**。"
          )
          if marker not in text:
              raise SystemExit("C1 next-stage marker not found")
          text = text.replace(marker, replacement, 1)

          prefix = "A1/A2/A3/A4/A5 与 B1/B2/B3/B4/B5/B6/B7/B8 共同构成进入 Phase C 的安全冻结："
          lines = text.splitlines()
          matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
          if len(matches) != 1:
              raise SystemExit(f"expected one Phase C safety paragraph, found {len(matches)}")
          lines[matches[0]] = (
              "A1/A2/A3/A4/A5、B1/B2/B3/B4/B5/B6/B7/B8 与 C1 共同构成进入 C2 的安全冻结：Public API / capability、failed-refit atomicity、迁移风险、性能/内存现状、用户可观察契约、private capability spine、canonical validation/distance/time/weights/WLS/search-domain/Gaussian-diagnostics 边界，以及 standard-GWR private engine ownership 必须同时守住；标准 GWR 的独立 reference evidence 继续作为 blocking numerical gate。A4 的 timing/RSS 仅作为 observational baseline，不设置 noisy wall-time CI gate；live structural memory guards 继续阻止 streamed GWR 意外引入 retained `n × n` buffer，并保留 `compute_hat_matrix=True` 的显式 dense S 行为。C2 只允许补强并冻结 GWR engine 的 numerical/behavior gates（external references、deep hat/influence/Cook's D、rank-deficient behavior、prediction、streaming、bandwidth provenance、failed-refit atomicity），不得放宽 tolerance、修改 reference fixture、改变 estimator API/统计公式/search semantics，不得提前进入 D1 或后续模型迁移、base rewrite、concrete inheritance 移除或性能算法重写。"
          )
          handoff.write_text("\n".join(lines) + "\n", encoding="utf-8")

          adr = Path("ARCHITECTURE_FINAL_DECISION.md")
          text = adr.read_text(encoding="utf-8")
          old = "| C1 | GWR private engine extraction | PENDING | — | — | full GWR freeze | golden architecture sample |"
          new = "| C1 | GWR private engine extraction | DONE | #59 | `69d2f441a29cf02976bc1b1502193da70c2b23e8` | full GWR freeze + full CI | private `_gwr_engine.py`; public GWR API/numerics preserved; no D1 cleanup |"
          if text.count(old) != 1:
              raise SystemExit(f"expected one C1 ledger row, found {text.count(old)}")
          adr.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit docs-only bookkeeping
        run: |
          git rm .github/workflows/c1-bookkeeping-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 00_REFACTOR_HANDOFF.md ARCHITECTURE_FINAL_DECISION.md
          git commit -m "Record C1 GWR private engine completion"
          git push origin HEAD:docs/c1-ledger-handoff
